<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Cookie Gradient -->
    <linearGradient id="cookie-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Syncer Arrow Gradient -->
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Round Rect Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Cookie Base Shape -->
  <circle cx="64" cy="64" r="38" fill="url(#cookie-grad)" />
  
  <!-- Cookie Chunks (Bites out of edge) -->
  <circle cx="98" cy="48" r="12" fill="#0f172a" />
  <circle cx="98" cy="48" r="12" fill="url(#bg-grad)" fill-opacity="0.5" />
  
  <!-- Chocolate Chips -->
  <circle cx="50" cy="42" r="4.5" fill="#451a03" />
  <circle cx="78" cy="50" r="4" fill="#451a03" />
  <circle cx="46" cy="74" r="5" fill="#451a03" />
  <circle cx="70" cy="80" r="4" fill="#451a03" />
  <circle cx="58" cy="58" r="4.5" fill="#451a03" />
  
  <!-- Syncer Arrows overlay -->
  <path d="M 64 12 A 52 52 0 0 1 116 64" fill="none" stroke="url(#arrow-grad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 116 64 L 122 52 M 116 64 L 104 56" fill="none" stroke="url(#arrow-grad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  
  <path d="M 64 116 A 52 52 0 0 1 12 64" fill="none" stroke="url(#arrow-grad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 12 64 L 6 76 M 12 64 L 24 72" fill="none" stroke="url(#arrow-grad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
</svg>
